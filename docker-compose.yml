services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped

  hosting-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: shellui/hosting-service:local
    container_name: hosting-service
    ports:
      - "${HOSTING_SERVICE_PORT:-8002}:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env and set SECRET_KEY}"
      DEBUG: "${DEBUG:-true}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      POSTGRES_DATABASE_URL: "${POSTGRES_DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
      SQLITE_PATH: "/app/data/db.sqlite3"
      MEDIA_ROOT: "/app/data/media"
      HOSTING_BACKEND: "${HOSTING_BACKEND:-filesystem}"
      HOSTING_APP_DOMAIN: "${HOSTING_APP_DOMAIN:-shellui.local}"
      HOSTING_APP_SCHEME: "${HOSTING_APP_SCHEME:-http}"
      IDENTITY_SERVICE_URL: "${IDENTITY_SERVICE_URL:-http://localhost:8000}"
      IDENTITY_JWKS_URL: "${IDENTITY_JWKS_URL:-}"
      IDENTITY_JWKS_FILE: "${IDENTITY_JWKS_FILE:-}"
      IDENTITY_JWKS: "${IDENTITY_JWKS:-}"
      IDENTITY_ISSUER: "${IDENTITY_ISSUER:-}"
      IDENTITY_AUDIENCE: "${IDENTITY_AUDIENCE:-}"
      EMAIL_SERVICE_URL: "${EMAIL_SERVICE_URL:-https://email.shellui.com}"
      EMAIL_SERVICE_API_KEY: "${EMAIL_SERVICE_API_KEY:-}"
      EMAIL_SERVICE_ALLOW_PRIVATE: "${EMAIL_SERVICE_ALLOW_PRIVATE:-false}"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-true}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
    depends_on:
      - redis
    volumes:
      - hosting-service-data:/app/data
    restart: unless-stopped

volumes:
  hosting-service-data:
