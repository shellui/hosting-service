<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site unavailable — Shellui Hosting</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fafafa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --code-bg: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .page {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }
    .card {
      width: min(100%, 440px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
      padding: 1.75rem 1.5rem;
      text-align: center;
    }
    .code {
      display: inline-block;
      margin: 0 0 0.85rem;
      padding: 0.2rem 0.55rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--code-bg);
      border-radius: 6px;
    }
    h1 {
      margin: 0 0 0.55rem;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }
    .host {
      margin-top: 1.1rem;
      padding: 0.55rem 0.7rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--text);
      background: var(--code-bg);
      border-radius: 8px;
      word-break: break-all;
    }
    .site-footer {
      padding: 0.6rem 1rem 1rem;
      text-align: center;
      font-size: 0.72rem;
      color: #9ca3af;
    }
    .site-footer a {
      color: inherit;
      text-decoration: none;
    }
    .site-footer a:hover {
      color: var(--muted);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="card">
      <div class="code">404</div>
      <h1>{{ headline }}</h1>
      <p>{{ message }}</p>
      {% if host %}
        <div class="host">{{ host }}</div>
      {% endif %}
    </main>
  </div>
  <footer class="site-footer">
    <a href="https://shellui.com">shellui</a>
  </footer>
</body>
</html>
