<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 1080'%3E%3Cpath fill='%23e3a512' d='M525 199c-21 0-40 6-62 24L304 374c-28 27-43 53-43 85s13 65 36 93c22 25 51 46 77 47c5 1 10 0 15-5l324-322c18-18 27-32 28-47c1-13-3-22-9-27c-5-3-12-4-22-4H525zM641 474c-17 4-31 15-48 32L246 823c-10 10-15 20-13 32c3 15 13 24 27 25h195c23 0 40-5 57-19l155-149c31-29 48-61 53-96c4-32-4-65-19-90c-14-27-35-44-57-51c-13-4-26-4-37-1z'/%3E%3C/svg%3E" />
    <title>Site unavailable · Shellui Hosting</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #e3a512;
        --primary-ink: #c4920a;
        --background: #ffffff;
        --foreground: #111827;
        --muted: #f9fafb;
        --muted-foreground: #4b5563;
        --border: #e5e7eb;
        --card: #ffffff;
      }
      html.dark {
        color-scheme: dark;
        --primary: #e8b84a;
        --primary-ink: #e8b84a;
        --background: #030712;
        --foreground: #f9fafb;
        --muted: rgb(255 255 255 / 0.05);
        --muted-foreground: #9ca3af;
        --border: #1f2937;
        --card: #111827;
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        min-height: 100%;
        flex-direction: column;
        background: var(--muted);
        color: var(--foreground);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html.dark body { background: var(--background); }
      .page-x { padding-left: 1rem; padding-right: 1rem; }
      @media (min-width: 640px) { .page-x { padding-left: 1.5rem; padding-right: 1.5rem; } }
      @media (min-width: 1024px) { .page-x { padding-left: 2rem; padding-right: 2rem; } }
      .logo-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
      header {
        border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
        background: var(--background);
      }
      nav { display: flex; align-items: center; max-width: 64rem; height: 4rem; margin: 0 auto; }
      .brand { display: inline-flex; color: var(--foreground); }
      .brand:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .brand svg { width: 2.125rem; height: 2.125rem; }
      main {
        display: flex;
        flex: 1;
        align-items: center;
        padding-top: 3rem;
        padding-bottom: 4rem;
      }
      .card {
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--card);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      .status { margin: 0; font-size: 0.875rem; font-weight: 500; color: var(--primary-ink); }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      .message { margin: 0.75rem 0 0; font-size: 0.875rem; line-height: 1.625; color: var(--muted-foreground); }
      .host {
        margin: 1rem 0 0;
        padding: 0.55rem 0.7rem;
        overflow-wrap: anywhere;
        border-radius: 0.5rem;
        background: var(--muted);
        color: var(--foreground);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.8rem;
      }
      .home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        margin-top: 1.5rem;
        padding: 0.625rem 1.25rem;
        border-radius: 0.375rem;
        background: var(--foreground);
        color: var(--background);
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
      .home:hover { opacity: 0.9; }
      .home:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("theme"); } catch (e) {}
        var theme =
          stored ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" class="logo-sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="logo-shellui-mark" viewBox="0 0 1080 1080">
        <g transform="matrix(1.28904,0,0,1.26641,-101.377,-56.7975)">
          <path fill="currentColor" fill-rule="nonzero" d="M509,202C493,202 478,207 461,221L338,340C316,361 305,382 305,407C305,433 315,458 333,480C350,500 373,516 393,517C397,518 401,517 405,513L656,263C670,249 677,238 678,226C679,216 676,209 671,205C667,203 662,202 654,202L509,202Z" />
          <path fill="currentColor" fill-rule="nonzero" d="M599,419C586,422 575,431 562,444L320,695C312,703 308,711 310,720C312,732 320,739 331,740L482,740C500,740 513,736 526,725L646,607C670,584 683,559 687,531C690,506 684,480 672,460C661,439 645,425 628,420C618,417 608,417 599,419Z" />
        </g>
      </symbol>
    </svg>
    <header class="page-x">
      <nav aria-label="Global">
        <a class="brand" href="https://shellui.com" aria-label="Shellui Hosting" translate="no">
          <svg viewBox="0 0 1080 1080" role="img" aria-hidden="true"><use href="#logo-shellui-mark"></use></svg>
        </a>
      </nav>
    </header>
    <main class="page-x">
      <div class="card">
        <p class="status">404</p>
        <h1>{{ headline }}</h1>
        <p class="message">{{ message }}</p>
        {% if host %}
          <div class="host">{{ host }}</div>
        {% endif %}
        <a class="home" href="https://shellui.com">Shellui</a>
      </div>
    </main>
  </body>
</html>
