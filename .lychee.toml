# Lychee — markdown / docs link checker (CI: .github/workflows/ci.yml)
# https://github.com/lycheeverse/lychee

#############################  Cache  ##############################

cache = true
max_cache_age = "2d"
# Never cache server errors, so a transient 5xx is re-checked next time.
cache_exclude_status = "500.."

#############################  Runtime  ############################

max_concurrency = 8
timeout = 20
# lychee 0.24.2 retries 429 only. It does not retry 502, 503, or 504.
# GitHub returns those during short outages, so they are accepted here.
# A 404 or any other 4xx still fails the job.
max_retries = 5
retry_wait_time = 3
accept = ["200", "204", "206", "429", "502", "503", "504"]

#############################  Excludes  ###########################

# Local / placeholder hosts used in docs and README examples
exclude = [
  '^https?://localhost(:[0-9]+)?(/|$)',
  '^https?://127\.0\.0\.1(:[0-9]+)?(/|$)',
  '^https?://\[::1\](:[0-9]+)?(/|$)',
  '^https?://([^/]*\.)?example\.com(/|$)',
  '^https?://id\.example(/|$)',
  '^https?://([^/]*\.)?shellui\.local(:[0-9]+)?(/|$)',
  '^https?://([^/]*\.)?shellui\.app(/|$)',
  # Angle-bracket placeholders
  '^https?://<',
]

exclude_path = [
  '\.venv',
]

scheme = ['https', 'http']
include_verbatim = false
